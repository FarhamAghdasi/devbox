# DevBox Default Configuration
# Override these values to customize your environment.
# Do NOT store passwords in this file.

# Database
DB_ROOT_USER=root
DEFAULT_DB_HOST=127.0.0.1
DEFAULT_DB_PORT=3306

# Services
APACHE_SERVICE=httpd
